services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      APP_URL: http://localhost:8000
      WEB_URL: http://localhost:5173
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025"

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - api
